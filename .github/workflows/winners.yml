# Weekly winners check. Independent of the listing pipeline: it reads
# data/events.json and writes only data/winners.json and its own health log
# (data/health/winners-*.json*), then commits those back to the branch.
name: Winners (weekly)

on:
  schedule:
    - cron: '23 4 * * 1' # Mondays 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write

# Never run two data-writing jobs at once.
concurrency:
  group: data-store
  cancel-in-progress: false

jobs:
  winners:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run winners
      - name: Commit winners data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/winners.json data/health/winners-runs.jsonl data/health/winners-latest.json
          if git diff --cached --quiet; then
            echo "No winners changes."
          else
            git commit -m "Weekly winners check"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
